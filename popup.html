<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="popup-header">
        <h1>Job Autofill</h1>
      </header>
      <button id="settings" class="header-settings setup-required" type="button">
        <span class="settings-leading">
          <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.86 1.86-.06-.06A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V20h-2.6v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-1.86-1.86.06-.06A1.7 1.7 0 0 0 7.5 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H5.7V11h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.34-1.88L7 7.96 8.86 6.1l.06.06A1.7 1.7 0 0 0 10.8 6.5a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1v-.1h2.6v.1a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.86 1.86-.06.06A1.7 1.7 0 0 0 19.3 9.8c.13.4.36.75.68 1 .3.25.7.4 1.1.4h.1v2.6h-.1a1.7 1.7 0 0 0-1.68 1.2Z" />
          </svg>
          <span class="settings-copy">
            <strong id="settingsLabel">Set up profile &amp; settings</strong>
            <small id="settingsRequired">Required before your first autofill</small>
          </span>
        </span>
        <span class="settings-action" aria-hidden="true">Open</span>
      </button>

      <section class="popup-card resume-section">
        <div class="card-heading">
          <div class="resume-label">Upload resume</div>
          <button id="resumeSettings" class="link-button" type="button">Resume settings</button>
        </div>
        <label id="resumeDrop" class="resume-drop" for="resumeFile">
          <input id="resumeFile" type="file" accept="application/pdf,.pdf" />
          <strong>Choose or drop a resume PDF</strong>
          <span id="resumeStatus">Loading resume…</span>
        </label>
      </section>

      <section class="popup-card job-section">
        <label id="jobDescriptionLabel" class="jd-label" for="jobDescription">Job description · auto-captured</label>
        <textarea id="jobDescription" placeholder="Open a job posting to capture its description, or paste it here manually."></textarea>
        <div class="job-actions">
          <button id="detect" class="secondary" type="button">Refresh page</button>
          <label class="secondary file-action" for="jobDescriptionFile">
            <input id="jobDescriptionFile" type="file" accept="application/pdf,.pdf,text/plain,.txt,.md,.markdown" />
            Upload JD
          </label>
        </div>
      </section>

      <section class="popup-card notes-panel">
        <div class="notes-copy">
          <strong>Job Application Record</strong>
          <button id="notesSettings" class="link-button" type="button">Export settings</button>
        </div>
        <button id="saveNote" class="secondary compact" type="button">Save application</button>
      </section>

      <section class="popup-card behaviour-section">
        <div class="card-heading">
          <strong>Autofill behaviour</strong>
          <button id="behaviourSettings" class="link-button" type="button">Behaviour settings</button>
        </div>
        <label class="toggle">
          <input id="overwrite" type="checkbox" checked />
          Overwrite fields that already contain text
        </label>
        <label class="toggle auto-next-toggle">
          <input id="autoNext" type="checkbox" />
          <span><strong>Auto-advance through completed pages</strong><small>Clicks only Next / Continue. Stops before Submit or whenever manual review is needed.</small></span>
        </label>
      </section>

      <button id="automationToggle" class="primary automation-toggle" type="button" aria-label="Pause automatic changes" aria-pressed="false" title="Pause automatic changes">
        <span class="automation-toggle-icon" aria-hidden="true">⏸</span>
        <span id="automationToggleLabel">Pause automatic changes</span>
      </button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
