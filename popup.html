<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="eyebrow">LOCAL-ONLY</div>
      <h1>Job Autofill</h1>
      <p>Detect or paste the job description, then fill the current application from your backend profile and resume.</p>
      <div class="resume-label">Saved CV</div>
      <label id="resumeDrop" class="resume-drop" for="resumeFile">
        <input id="resumeFile" type="file" accept="application/pdf,.pdf" />
        <strong>Drop PDF here or choose a file</strong>
        <span id="resumeStatus">Loading saved CV…</span>
      </label>
      <label class="jd-label" for="jobDescription">Job description</label>
      <textarea id="jobDescription" placeholder="Paste the job description here, or detect it from the current page."></textarea>
      <button id="detect" class="secondary" type="button">Detect from current page</button>
      <label class="toggle">
        <input id="overwrite" type="checkbox" checked />
        Overwrite fields that already contain text
      </label>
      <button id="fill" class="primary" type="button">Fill with CV + JD</button>
      <button id="settings" class="secondary" type="button">Edit profile & answers</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
