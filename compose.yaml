name: job-auto-fill

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-auto-fill-backend
    restart: unless-stopped
    environment:
      JOB_AUTOFILL_HOST: 0.0.0.0
      JOB_AUTOFILL_PORT: 17840
      JOB_AUTOFILL_CONFIG_PATH: /data/local-config.json
      JOB_AUTOFILL_PROFILE_PATH: /data/profile.json
      JOB_AUTOFILL_RESUME_PATH: /data/resume.pdf
    ports:
      - "127.0.0.1:17840:17840"
    volumes:
      - type: bind
        source: ./local-data
        target: /data
    security_opt:
      - no-new-privileges:true
